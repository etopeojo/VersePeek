appId: com.kaleotech.versepeek
productName: VersePeek
copyright: Copyright © 2026 KaleoTechSolutions
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - resources/**/*
extraResources:
  - from: resources
    to: resources
mac:
  category: public.app-category.reference
  target:
    - dmg
    - zip
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: KaleoTechSolutions <support@kaleotechsolutions.com>
  icon: resources/icon.png
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
